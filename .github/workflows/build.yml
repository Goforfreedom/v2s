name: Build check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Build (Debug)
        run: |
          xcodebuild \
            -project v2s.xcodeproj \
            -scheme v2s \
            -configuration Debug \
            -derivedDataPath .build/debug \
            build
